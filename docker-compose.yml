services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./server
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    environment:
      PORT: "5000"
      # Compose DNS resolves mongodb to the database container on app-network.
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
    networks:
      - app-network

  frontend:
    build:
      context: .
      args:
        # This URL is embedded for browsers running on the host machine.
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
